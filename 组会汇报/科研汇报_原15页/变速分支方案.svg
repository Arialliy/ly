<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="242" viewBox="0 0 1440 242" version="1.1" role="img" aria-labelledby="fig-title fig-desc" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title id="fig-title">分段速度配对分支（拟验证，尚未训练）</title><desc id="fig-desc">现有时刻与速度特征分流到前八帧和后八帧，各自按速度汇总。配对允许相同速度或每轴相差至多0.5像素每帧的相邻速度。融合后输出16维运动证据，接回现有特征融合与检测头。</desc><rect id="background" x="0" y="0" width="1440" height="242" fill="#FFFFFF" /><defs><marker id="arrow" viewBox="0 0 9 9" refX="7.5" refY="4.5" markerWidth="7.5" markerHeight="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#32756E" /></marker></defs><g id="connections" fill="none" stroke="#32756E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"><path id="input-to-split" d="M252 105 H281" /><path id="split-to-before" d="M281 105 V48 H312" marker-end="url(#arrow)" /><path id="split-to-after" d="M281 105 V162 H312" marker-end="url(#arrow)" /><path id="before-to-pair" d="M595 48 H626 V83 H657" marker-end="url(#arrow)" /><path id="after-to-pair" d="M595 162 H626 V127 H657" marker-end="url(#arrow)" /><path id="pair-to-vector" d="M981 105 H1020" marker-end="url(#arrow)" /><path id="vector-to-detector" d="M1191 105 H1230" marker-end="url(#arrow)" /></g><g id="time-velocity-features"><rect x="18" y="69" width="234" height="72" rx="9" ry="9" fill="#FFFFFF" stroke="#95ACAD" stroke-width="2" /><text x="135.0" y="114" text-anchor="middle" font-size="23" font-weight="600" fill="#173C43">现有时刻 × 速度特征</text></g><g id="before-pooling"><rect x="315" y="19" width="280" height="58" rx="9" ry="9" fill="#FFFFFF" stroke="#95ACAD" stroke-width="2" /><text x="455.0" y="56" text-anchor="middle" font-size="23" font-weight="600" fill="#173C43">前 8 帧按候选速度汇总</text></g><g id="after-pooling"><rect x="315" y="133" width="280" height="58" rx="9" ry="9" fill="#FFFFFF" stroke="#95ACAD" stroke-width="2" /><text x="455.0" y="170" text-anchor="middle" font-size="23" font-weight="600" fill="#173C43">后 8 帧按候选速度汇总</text></g><g id="pair-aggregation"><rect x="660" y="51" width="321" height="108" rx="9" ry="9" fill="#F0F8F6" stroke="#43897F" stroke-width="2" /><text x="820.5" y="86" text-anchor="middle" font-size="25" font-weight="600" fill="#15655D">前后两段的速度配对</text><text x="820.5" y="117" text-anchor="middle" font-size="21" font-weight="400" fill="#173C43">允许同速或相邻速度</text><text x="820.5" y="145" text-anchor="middle" font-size="18" font-weight="400" fill="#45626A">每轴速度差至多 0.5 像素/帧</text></g><g id="motion-evidence"><rect x="1023" y="69" width="168" height="72" rx="9" ry="9" fill="#FFFFFF" stroke="#95ACAD" stroke-width="2" /><text x="1107.0" y="99" text-anchor="middle" font-size="24" font-weight="600" fill="#173C43">16 维</text><text x="1107.0" y="129" text-anchor="middle" font-size="23" font-weight="600" fill="#173C43">运动证据</text></g><g id="existing-fusion-and-head"><rect x="1233" y="69" width="188" height="72" rx="9" ry="9" fill="#FFFFFF" stroke="#95ACAD" stroke-width="2" /><text x="1327.0" y="100" text-anchor="middle" font-size="23" font-weight="600" fill="#173C43">沿用特征融合</text><text x="1327.0" y="129" text-anchor="middle" font-size="23" font-weight="600" fill="#173C43">与检测头</text></g><g id="proposal-status"><text x="720" y="225" text-anchor="middle" font-size="22" font-weight="400" fill="#45626A">拟验证，尚未训练</text></g></svg>