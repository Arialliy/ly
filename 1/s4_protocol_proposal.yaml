  schedule_hashes: null

loss:
  foreground_bce_weight_when_both_classes_present: 0.5
  background_bce_weight_when_both_classes_present: 0.5
  background_full_weight: 0.75
  background_hard_weight: 0.25
  hard_background_fraction: 0.10
  hard_background_min_pixels: 16
  hard_background_max_pixels: eligible_count
  hard_background_gt_protection_radius_px: 3
  protection_mask_dilation_domain: full_center_mask_then_crop
