    - {start_completed_updates: 16000, lr: 1.0e-4}
  default_updates: 24000
  extended_updates: 36000
  extension:
    decision_after: all_four_models_and_three_seeds_finish_24000
    trigger: any_run_monotone_train_diagnostic_loss_reduction
    diagnostic_steps: [18000, 21000, 24000]
    strict_monotone: true
    relative_reduction_at_least: 0.03
    comparison_gap_used: false
    apply_to: all_four_models_and_all_three_seeds
