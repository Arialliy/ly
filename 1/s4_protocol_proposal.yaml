  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-4
  foreach: false
  precision: float32
  amp: false
  tf32: false
  deterministic_algorithms: true
  cudnn_benchmark: false
  accumulation_steps: 1
  gradient_clipping: null
  nonfinite_policy: stop_and_preserve_failure_record
